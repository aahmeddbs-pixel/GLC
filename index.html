<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLC Resources · SISD</title>
<style>
:root{--navy:#1B2D4E;--red:#DC2B3E;--maroon:#8E1B2E;--grey:#6b7280;--bg:#f4f6fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#1d2433}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px}
header{background:#fff;border-top:6px solid var(--red);border-radius:12px;padding:20px;display:flex;gap:16px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
h1{margin:0;color:var(--maroon);font-size:26px}
h1 small{display:block;font-size:15px;color:var(--navy);font-weight:normal;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:18px}
a.tile{display:block;text-decoration:none;background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:5px solid var(--red);color:inherit;transition:transform .1s}
a.tile:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.08)}
a.tile h2{margin:0 0 6px;color:var(--navy);font-size:18px}
a.tile p{margin:0;color:var(--grey);font-size:14px;line-height:1.45}
.go{display:inline-block;margin-top:12px;font-weight:bold;color:var(--red);font-size:14px}
footer{text-align:center;color:var(--grey);font-size:12px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke-width="6"><circle cx="28" cy="40" r="20" stroke="#DC2B3E"/><circle cx="50" cy="26" r="20" stroke="#DC2B3E"/><circle cx="72" cy="40" r="20" stroke="#DC2B3E"/><circle cx="50" cy="66" r="20" stroke="#8a8f99"/></g></svg>
  <h1>GLC Resources<small>Grade Level Coordinator tools · Secondary</small></h1>
 </header>
 <div class="grid">
  <a class="tile" href="monitoring-card.html">
   <h2>Progress Monitoring Card</h2>
   <p>Daily lesson card for students on monitoring: Ready · Responsible · Respectful. Teachers record each lesson; the GLC reviews weekly.</p>
   <span class="go">Open card →</span>
  </a>
 </div>
 <footer>Swiss International Scientific School Dubai · GLC</footer>
</div>
</body>
</html>
